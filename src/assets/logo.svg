<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Seasons Cake Logo">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3f33" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Botanical Foliage Layer (Left, Top, Right, Bottom surrounding disk) -->
  <g id="foliage">
    <!-- Top-left Sage Leaves -->
    <path d="M150 110 C140 75 165 50 172 45 C175 68 168 95 150 110 Z" fill="#6B8E63" />
    <path d="M148 110 C130 90 125 65 130 52 C142 66 145 92 148 110 Z" fill="#8BAA78" />
    <path d="M150 110 Q145 80 172 45" stroke="#4B6E4A" stroke-width="1.5" fill="none" />

    <!-- Autumn Rust Maple Leaf (Left) -->
    <path d="M90 175 C82 155 95 142 108 140 C112 128 126 126 138 135 C148 120 162 128 160 145 C175 152 172 168 160 178 C168 195 155 208 140 205 C132 218 115 220 105 205 C90 210 80 195 90 175 Z" fill="#C85A32" />
    <path d="M110 235 C95 210 102 185 132 175 C120 195 125 220 110 235 Z" fill="#B3421E" />

    <!-- Autumn Ochre Leaf (Top Left behind) -->
    <path d="M115 135 C108 105 128 85 142 80 C155 95 145 122 115 135 Z" fill="#D98E32" />
    <path d="M115 135 Q130 105 142 80" stroke="#B87220" stroke-width="1.5" fill="none" />

    <!-- Top-Right Fresh Green Leaves -->
    <path d="M235 110 C242 75 225 50 218 45 C215 68 222 95 235 110 Z" fill="#6B8E63" />
    <path d="M238 110 C255 90 262 65 258 52 C245 66 242 92 238 110 Z" fill="#8BAA78" />
    <path d="M235 110 Q240 80 218 45" stroke="#4B6E4A" stroke-width="1.5" fill="none" />

    <!-- Right Side Eucalyptus / Fern Branch -->
    <g id="fern-sprig" fill="#6B8E63">
      <ellipse cx="270" cy="150" rx="9" ry="16" transform="rotate(35 270 150)" />
      <ellipse cx="282" cy="172" rx="8" ry="14" transform="rotate(45 282 172)" fill="#5A7D54" />
      <ellipse cx="260" cy="132" rx="7" ry="12" transform="rotate(25 260 132)" fill="#8BAA78" />
    </g>

    <!-- Bottom-Right Palm / Tropical Frond -->
    <path d="M255 195 C285 190 300 210 290 235 C265 240 248 220 255 195 Z" fill="#4B6E4A" />
    <!-- Frond Ridges -->
    <path d="M255 195 Q275 210 290 235" stroke="#335232" stroke-width="2" fill="none" />
    <path d="M260 202 L275 196 M265 210 L285 204 M270 218 L290 215 M275 226 L288 228" stroke="#335232" stroke-width="1.5" />

    <!-- Bottom Sprouting Leaves -->
    <path d="M190 250 C185 270 170 280 160 282 C168 268 178 258 190 250 Z" fill="#6B8E63" />
    <path d="M210 250 C218 268 230 278 242 278 C232 265 224 256 210 250 Z" fill="#8BAA78" />
  </g>

  <!-- Central Sandstone Disk -->
  <circle cx="200" cy="180" r="82" fill="#F2EFE9" filter="url(#subtle-shadow)" stroke="#E5E0D5" stroke-width="1.5" />

  <!-- Logo Typography -->
  <!-- "Seasons" Script -->
  <g id="seasons-text" transform="translate(200, 172)" text-anchor="middle">
    <text font-family="'Brush Script MT', 'Bickham Script Pro', 'Great Vibes', 'Edwardian Script ITC', 'Lucida Calligraphy', 'Iowan Old Style', Georgia, serif"
          font-size="44"
          font-style="italic"
          font-weight="500"
          fill="#1E3F33"
          letter-spacing="0.5">Seasons</text>
  </g>

  <!-- Terracotta Rule Underline -->
  <line x1="148" y1="184" x2="252" y2="184" stroke="#C85A32" stroke-width="2.8" stroke-linecap="round" />

  <!-- "CAKE" Tracked Sans-Serif -->
  <g id="cake-text" transform="translate(200, 202)" text-anchor="middle">
    <text font-family="'Century Gothic', 'Tw Cen MT', 'Aptos', 'Montserrat', 'Segoe UI', sans-serif"
          font-size="14.5"
          font-weight="700"
          letter-spacing="5"
          fill="#1E3F33">CAKE</text>
  </g>

  <!-- "Delicious & Fresh" Tagline Below Emblem -->
  <g id="tagline-text" transform="translate(200, 310)" text-anchor="middle">
    <text font-family="'Century Gothic', 'Tw Cen MT', 'Aptos', 'Segoe UI', sans-serif"
          font-size="18"
          font-weight="700"
          letter-spacing="0.8"
          fill="#1E3F33">Delicious &amp; Fresh</text>
  </g>
</svg>
