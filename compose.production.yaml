services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe production PostgreSQL password}

  api:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set Django allowed hosts},127.0.0.1,localhost"
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set HTTPS CSRF trusted origins}
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DATABASE_URL: postgresql://season_cake:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/season_cake

  worker:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgresql://season_cake:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/season_cake

  beat:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgresql://season_cake:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/season_cake

  backup:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT}

  bms-portal:
    build:
      context: ./bms-frontend
      dockerfile: Dockerfile.production
    environment: {}
    expose:
      - "80"
    command: ["nginx", "-g", "daemon off;"]

  public-website:
    build:
      context: .
      dockerfile: Dockerfile.public.production
    environment: {}
    expose:
      - "80"
    command: ["nginx", "-g", "daemon off;"]

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SEASON_PUBLIC_HOST: ${SEASON_PUBLIC_HOST:?Set SEASON_PUBLIC_HOST}
      SEASON_BMS_HOST: ${SEASON_BMS_HOST:?Set SEASON_BMS_HOST}
      NGINX_ENVSUBST_FILTER: "^(SEASON_PUBLIC_HOST|SEASON_BMS_HOST)$"
    volumes:
      - ./infra/nginx.production.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR}:/etc/nginx/tls:ro
      - season-static:/var/www/static:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/nginx"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  season-postgres:
  season-media:
  season-static:
  season-backups:
